name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate game metadata
        id: manifest
        run: node scripts/platform/validate.mjs
      - name: Install smoke-test browser
        if: steps.manifest.outputs.publish == 'true'
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the production build
        if: steps.manifest.outputs.publish == 'true'
        run: node scripts/platform/smoke.mjs
      - name: Reject an outdated release
        if: steps.manifest.outputs.publish == 'true'
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Publish tested artifact
        if: steps.manifest.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npx --no-install wrangler deploy --name "pg-${GITHUB_REPOSITORY#*/}" --keep-vars
      - name: Verify live game
        if: steps.manifest.outputs.publish == 'true'
        run: node scripts/platform/verify.mjs
      - name: Refresh portal
        if: steps.manifest.outputs.publish == 'true'
        env:
          PORTAL_DISPATCH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        run: node scripts/platform/dispatch.mjs
